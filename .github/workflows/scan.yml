name: Scan and broadcast signals

# Every 30 min = ~48 runs/day (~1,440 min/month billed, since GitHub rounds
# each job up to the nearest minute regardless of actual run time). A
# private repo's free Actions minutes (2,000/month) don't leave much room
# above that — 15 min (~2,880 min/month) already exceeds it on the Free
# plan, which would mean the cron silently stops mid-month right when we
# want weeks of uninterrupted data for the track record. Go tighter only
# if the repo is public (unlimited Actions minutes) or you've confirmed
# your plan's quota covers it — and set a $0 spending limit in GitHub
# billing settings regardless, so a quota overrun stops runs instead of
# charging you.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/scan
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "${DEPLOY_URL}/api/scan" \
            -H "X-Scan-Secret: ${SCAN_SECRET}")
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
        env:
          DEPLOY_URL: ${{ secrets.SCAN_DEPLOY_URL }}
          SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
